# Template for a new app (copied by the /add-app skill). Every platform starts disabled.
name: NewApp
store_url: https://play.google.com/store/apps/details?id=com.example.newapp
bio_link: https://example.com/?utm_source={platform}
tagline: Free on Google Play
timezone: America/New_York
post_times: ["08:00", "10:00", "12:00", "13:30", "15:00", "17:00", "18:30", "19:30", "20:30", "22:00"]
platforms:
  instagram: {enabled: false, target: 5}
  facebook: {enabled: false, target: 5}
brand:
  colors: {bg: "#0B0B0F", accent: "#7C5CFF", accent2: "#FFD400", text: "#FFFFFF", muted: "#A0A0B0"}
  fonts: {display: "Archivo Black", mono: "JetBrains Mono"}
  icon: brand/icon.png
banned: []
meta:
  ig_user_id_secret: NEWAPP_IG_USER_ID
  page_id_secret: NEWAPP_FB_PAGE_ID
  token_secret: NEWAPP_META_PAGE_TOKEN

name: ScrollSmack
store_url: https://play.google.com/store/apps/details?id=com.scrollsmack.app
bio_link: https://scrollsmack.app/?utm_source={platform}
tagline: Free on Google Play
timezone: America/New_York
post_times: ["08:00", "10:00", "12:00", "13:30", "15:00", "17:00", "18:30", "19:30", "20:30", "22:00"]
platforms:
  youtube: {enabled: true, enabled_on: 2026-11-25, target: 5}
  tiktok: {enabled: true, enabled_on: 2026-11-25, target: 5}  # inbox drafts: TikTok allows 5 pending per 24 h
  # Meta disabled the ScrollSmack Instagram account on 2026-11-21; don't recreate it (Meta terms).
  instagram: {enabled: false, enabled_on: 2026-12-05, target: 5}
  facebook: {enabled: false, enabled_on: 2026-12-05, target: 5}
brand:
  colors: {bg: "#000000", accent: "#FF2D2D", accent2: "#FFD400", soft: "#FFB4AB", text: "#FFFFFF", muted: "#B5B5B5"}
  fonts: {display: "Archivo Black", mono: "JetBrains Mono"}
  icon: brand/icon.png
banned: []
youtube:  # one Google OAuth client can serve every app; the refresh token is per channel
  client_id_secret: YOUTUBE_CLIENT_ID
  client_secret_secret: YOUTUBE_CLIENT_SECRET
  refresh_token_secret: SCROLLSMACK_YOUTUBE_REFRESH_TOKEN
tiktok:  # inbox drafts; the rotating token lives encrypted in state/scrollsmack/tiktok_token.enc
  client_key_secret: TIKTOK_CLIENT_KEY
  client_secret_secret: TIKTOK_CLIENT_SECRET
  token_key_secret: TIKTOK_TOKEN_KEY
  redirect_uri: https://scrollsmack.app/
meta:
  ig_user_id_secret: SCROLLSMACK_IG_USER_ID
  page_id_secret: SCROLLSMACK_FB_PAGE_ID
  token_secret: SCROLLSMACK_META_PAGE_TOKEN

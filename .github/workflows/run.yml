name: run
# Every 30 min: post any due slot for every app. Renders just in time, then commits the ledger.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = render and log only, 0 = really post"
        default: "1"
        required: true
      now:
        description: "optional ISO time to pretend it is (testing)"
        required: false

concurrency:
  group: engine-run
  cancel-in-progress: false

permissions:
  contents: write  # this job commits state/<app>/ledger.jsonl

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install .
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Run engine
        env:
          ENGINE_SECRETS: ${{ toJSON(secrets) }}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || '1' }}
          HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
          NOW: ${{ inputs.now }}
        run: python -m engine.main run ${NOW:+--now "$NOW"}
      - name: Commit ledger
        if: always()
        run: |
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ledger: $(date -u +%FT%RZ)"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: videos-${{ github.run_id }}
          path: out/**/*.mp4
          retention-days: 7
          if-no-files-found: ignore

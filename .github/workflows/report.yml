name: report
# Daily Telegram summary: 23:30 ET in winter (00:30 in summer).
# GitHub registers a workflow when a push changes its file: if Actions lists none, touch this file.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "optional YYYY-MM-DD (defaults to today in New York)"
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Send report
        env:
          ENGINE_SECRETS: ${{ toJSON(secrets) }}
          DAY: ${{ inputs.day }}
        run: python -m engine.main report ${DAY:+--day "$DAY"}
